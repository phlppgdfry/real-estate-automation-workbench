      - id: knowledge-guard
        type: custom
        position:
          x: 1200
          y: 650
        positionAbsolute:
          x: 1200
          y: 650
        width: 244
        height: 140
        selected: false
        data:
          type: code
          title: Procedurebron onafhankelijk toetsen
          desc: Python accepteert uitsluitend canonieke actuele bronnen in de gekozen taal en vereist de volledige letterlijke proceduretekst. Onjuiste of verouderde bron stopt de run.
          selected: false
          code_language: python3
          code: |
            import json
            import re
            import unicodedata

            # Replaced from the canonical procedure manifest by scripts/dify/sync.ts.
            PROCEDURES = json.loads(r'''[{"id":"SOP-VISIT-NL-2","language":"nl","version":2,"valid_from":"2026-10-01","state":"current","title":"Bezoekaanvraag opvolgen","text":"Controleer eerst de actuele pandstatus en de referentie. Een verkocht pand mag niet voor een bezoek worden bevestigd. Een medewerker beslist over de volgende stap. Een voorgestelde tekst is geen afspraakbevestiging.","keywords":["bezoek","bezoeken","bezoekaanvraag","verkocht","beschikbaar","pandstatus","afspraak","referentie","opvolging","bevestigen"]},{"id":"SOP-DOC-NL-1","language":"nl","version":1,"valid_from":"2026-10-01","state":"current","title":"Onvolledige pandfiche","text":"Controleer referentie, gemeente, vraagprijs en status met de bron. Ontbreekt een basisveld, markeer het als onbevestigd en vraag de ontbrekende informatie op. Raad geen prijs, EPC of beschikbaarheid.","keywords":["document","documenten","fiche","pandfiche","ontbreekt","onvolledig","basisveld","vraagprijs","gemeente","epc","bron","status"]},{"id":"SOP-RECOVERY-NL-1","language":"nl","version":1,"valid_from":"2026-10-01","state":"current","title":"Mislukte CRM-overdracht herstellen","text":"Na drie mislukte CRM-pogingen stopt automatische verwerking. Alleen een operator mag met een concrete herstelreden opnieuw klaarzetten. Controleer eerst pandstatus, prijs en versie. Bewaar eerdere fouten en goedkeuring.","keywords":["crm","overdracht","herstel","herstellen","mislukt","pogingen","operator","retry","fouten","prijs","versie"]},{"id":"SOP-VISIT-FR-1","language":"fr","version":1,"valid_from":"2026-10-01","state":"current","title":"Demande de visite","text":"Vérifiez la référence et la disponibilité actuelle du bien. Ne confirmez pas de visite pour un bien vendu. Un collaborateur contrôle la proposition avant toute communication.","keywords":["visite","visiter","vendu","disponible","disponibilité","bien","référence","collaborateur","proposition","communication"]},{"id":"SOP-VISIT-NL-1","language":"nl","version":1,"valid_from":"2025-01-01","state":"superseded","title":"Oud bezoekproces","text":"Historische procedure. Dit document is vervallen en mag niet als actuele werkinstructie worden gebruikt.","keywords":["historisch","historische","oud","vervallen","procedure","bezoek","verkocht"]}]''')


            def normalized(value):
                return re.sub(r"\s+", " ", unicodedata.normalize("NFKC", value)).strip()


            def main(records: list, language: str) -> dict:
                if language not in ("nl", "fr") or not isinstance(records, list) or len(records) > 5:
                    raise ValueError("KNOWLEDGE_INPUT")
                allowed = {p["id"] + ".md": p for p in PROCEDURES
                           if p["language"] == language and p["state"] == "current"}
                facts = []
                seen = set()
                for record in records:
                    if not isinstance(record, dict):
                        raise ValueError("KNOWLEDGE_RECORD")
                    metadata = record.get("metadata") or {}
                    reference = allowed.get(metadata.get("document_name"))
                    content = record.get("content")
                    # Reject the whole run when retrieval violates the independent allowlist.
                    if not reference or not isinstance(content, str):
                        raise ValueError("KNOWLEDGE_SOURCE")
                    if normalized(reference["text"]) not in normalized(content):
                        raise ValueError("KNOWLEDGE_QUOTE")
                    if reference["id"] not in seen:
                        seen.add(reference["id"])
                        facts.append({"source_id": reference["id"], "quote": reference["text"]})
                result = {
                    "summary": "\n\n".join(f["quote"] for f in facts) if facts else
                    ("Geen passende actuele procedure gevonden. Vraag een medewerker om verduidelijking."
                     if language == "nl" else "Aucune procédure actuelle correspondante. Demandez une clarification à un collaborateur."),
                    "facts": facts,
                    "risks": ["Proceduretekst is geen bevestiging van actuele pandstatus of prijs." if language == "nl" else "La procédure ne confirme pas le statut ou le prix actuel du bien."],
                    "next_action": "Een medewerker controleert de procedure en de actuele dossierfeiten." if language == "nl" else "Un collaborateur vérifie la procédure et les faits actuels du dossier.",
                    "requires_human": True,
                }
                return {"result": json.dumps(result, ensure_ascii=False)}
          variables:
            - variable: records
              value_selector:
                - knowledge
                - result
            - variable: language
              value_selector:
                - procedure-language
                - language
          outputs:
            result:
              type: string
              children: null
      - id: procedure-answer
        type: custom
