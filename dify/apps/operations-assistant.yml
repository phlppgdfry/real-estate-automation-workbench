                id: 1d49e681-927d-46f9-8147-8288d551cf4e
                metadata_id: 4b411360-4ab3-487f-9d12-417e18a1b625
                name: state
                value: current
              - comparison_operator: is
                id: 9ee8dcbf-4e75-484d-8041-320037cd702f
                metadata_id: faf1b031-1bad-42c8-afd0-5279c76e416e
